name: Build Futures AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release_apk/FuturesAI-v1.0.0.apk \; || true
          ls -la release_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuturesAI-v1.0.0-APK
          path: release_apk/FuturesAI-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Futures AI Mobile v1.0.0 (Binance USDT-M)"
          body: |
            ### Futures AI Mobile v1.0.0 APK
            - Binance USDT-M Futures Yapay Zeka Mobil Uygulaması
            - 13 Adımlı Kronolojik Öğrenme Pipeline
            - SMC Likidite, Fair Value Gap (FVG), Fonlama Sıkışması Analizi
            - Canlı Mum Grafiği & Çizim Araçları
          files: release_apk/FuturesAI-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

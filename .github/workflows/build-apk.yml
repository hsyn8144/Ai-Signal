name: Build Futures AI Android APK

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK with Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release_apk/FuturesAI-v1.0.0.apk \; || true
          ls -la release_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuturesAI-v1.0.0-APK
          path: release_apk/FuturesAI-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/arena')
        with:
          tag_name: v1.0.0
          name: "Futures AI Mobile v1.0.0 (Binance USDT-M)"
          body: |
            ### Futures AI Mobile v1.0.0 APK Sürümü
            - Binance USDT-M Futures Özel Yapay Zeka Sinyal & Araştırma Uygulaması
            - 13 Adımlı Kronolojik Öğrenme & Çoklu Zaman Dilimi (MTF)
            - SMC (FVG, Likidite Avı), Fonlama Sıkışması, Likidasyon Mıknatısı
            - Profesyonel Mobil Mum Grafiği & Çizim Araçları
            - Aşağıdaki `FuturesAI-v1.0.0.apk` dosyasını telefonunuza indirip doğrudan kurabilirsiniz.
          files: release_apk/FuturesAI-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

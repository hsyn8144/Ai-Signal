name: Build Futures AI Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Download Gradle & Compile Android APK
        working-directory: android
        run: |
          echo "=== 1. Gradle 8.7 İndiriliyor ==="
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          export PATH=$PWD/gradle-8.7/bin:$PATH
          gradle -v
          
          echo "=== 2. Android APK Derleniyor ==="
          sed -i 's/ic_launcher_round/ic_launcher/g' app/src/main/AndroidManifest.xml || true
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p release_apk
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} release_apk/FuturesAI-v1.0.0.apk \; || true
          ls -la release_apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FuturesAI-v1.0.0-APK
          path: release_apk/FuturesAI-v1.0.0.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Futures AI Mobile v1.0.0 (Binance USDT-M)"
          body: |
            ### Futures AI Mobile v1.0.0 APK
            - Binance USDT-M Futures Yapay Zeka Mobil Uygulaması
            - 13 Adımlı Kronolojik Öğrenme Pipeline
            - SMC Likidite, Fair Value Gap (FVG), Fonlama Sıkışması Analizi
            - Canlı Mum Grafiği & Çizim Araçları
          files: release_apk/FuturesAI-v1.0.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
